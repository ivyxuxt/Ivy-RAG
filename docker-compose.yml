services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      # Override FRONTEND_ORIGIN for Docker mode — nginx serves frontend on :3000
      - FRONTEND_ORIGIN=http://localhost:3000
    volumes:
      - rag_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag_data:
